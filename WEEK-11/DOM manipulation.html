<!DOCTYPE html>
<html>
    <head>
        <title>Validation</title>
    </head>
    <body>
        Username: <input type="text" id="username" onkeyup="Validate()">
        <p id="msg"></p>
        <script>
            function validate() {
                let value = document.getElementById("username").value;
                if (value.length <5){
                    document.getElementById("msg").innerHTML="Minimum 5 characters required";
                    document.getElementById("msg").style.color="red";
                }
                else {
                    document.getElementById("msg").innerHTML="Valid username";      
                    document.getElementById("msg").style.color="green"; 

                }
            }
        </script>
    </body>
</html>
